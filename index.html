<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Проверка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script src="config.js"></script>
<link rel="stylesheet" href="style.css"></head><body>
<canvas id="sky"></canvas>
<main>
  <section id="s1" class="card show">
    <div class="step">Этап 1 из 2</div>
    <h1>Пройдите капчу</h1>
    <p>Нажмите на символ, который отличается от других</p>
    <div id="grid" class="grid"></div>
    <div id="tries" class="hint"></div>
  </section>
  <section id="s2" class="card">
    <div class="step">Этап 2 из 2</div>
    <h1>Подтвердите, что вы человек</h1>
    <div id="ts"></div>
    <div id="s2hint" class="hint">Проверка Cloudflare…</div>
  </section>
  <section id="s3" class="card">
    <div class="check">✓</div>
    <h1>Успешно!</h1>
    <p>Капча пройдена. Добро пожаловать.</p>
    <a id="join" class="btn" href="#">Вступить в чат</a>
  </section>
  <section id="s4" class="card">
    <div class="check bad">✕</div>
    <h1 id="ftitle">Не удалось</h1>
    <p id="ftext">Попробуйте снова через 10 минут.</p>
    <button class="btn ghost" >Закрыть</button>
  </section>
</main>
<script src="app.js"></script></body></html>
